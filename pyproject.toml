[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "extstats-advisor"
version = "0.1.0"
description = "Production-oriented PostgreSQL extended-statistics advisor"
requires-python = ">=3.12"
dependencies = ["pyarrow>=16,<23"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "ruff>=0.8,<1"]
postgres = ["psycopg[binary]>=3.2,<4", "pglast>=7,<8"]

[project.scripts]
extstats-advisor = "extstats_advisor.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/extstats_advisor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: tests requiring a live stock PostgreSQL server"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
